name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Compile all modules (incl. UI, no display needed)
        run: python -m compileall -q gan_fet
      - name: Import without credentials.json
        run: python -c "import gan_fet.app"
      - name: Run tests (simulated rig + real-data migration)
        run: pytest -q
