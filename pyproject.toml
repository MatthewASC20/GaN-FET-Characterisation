[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gan-fet-characterisation"
version = "2.0.0"
description = "Instrument control, data acquisition and analysis for GaN FET characterisation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # 3.9 is the floor for Axes.boxplot(tick_labels=...) used in storage/reports.py
    "matplotlib>=3.9",
    "pyvisa>=1.13",
    "pyvisa-py>=0.7",
]

[project.optional-dependencies]
sheets = [
    "google-api-python-client>=2.100",
    "google-auth>=2.22",
]
macos = [
    "tkmacosx>=1.0.5",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
gan-fet = "gan_fet.app:main"

[tool.setuptools.packages.find]
include = ["gan_fet*"]
