[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gan-fet-characterisation"
dynamic = ["version"]
description = "Instrument control, data acquisition and analysis for GaN FET characterisation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "pyserial>=3.5",
    "pyvisa>=1.13",
    "pyvisa-py>=0.7",
]

[project.optional-dependencies]
sheets = [
    "google-api-python-client>=2.100",
    "google-auth>=2.22",
]
macos = [
    "tkmacosx>=1.0.5",
]
dev = [
    "pytest>=7.4,<9",
    "ruff>=0.6,<0.17",
    # mypy 2.x currently crashes with an INTERNAL ERROR on this codebase.
    "mypy>=1.11,<2",
]

[project.scripts]
gan-fet = "gan_fet.app:main"

[tool.setuptools.packages.find]
include = ["gan_fet", "gan_fet.*"]

[tool.setuptools.dynamic]
version = {attr = "gan_fet.__version__"}

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
